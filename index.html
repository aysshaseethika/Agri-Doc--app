<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRI DOC - Your Agricultural Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex flex-column">
        <!-- Header -->
        <header class="bg-success text-white text-center py-4">
            <div class="container">
                <h1 class="display-4 fw-bold">AGRI DOC</h1>
                <p class="lead">Empowering Farmers with AI-Powered Agricultural Solutions</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow-1 d-flex align-items-center">
            <div class="container my-5">
                <div class="row justify-content-center">
                    <div class="col-md-10 text-center">
                        <h2 class="mb-5">Get Started</h2>
                        <div class="row g-4">
                            <!-- Agrognosis Card -->
                            <div class="col-md-6">
                                <div class="card h-100 border-success shadow-lg hover-scale">
                                    <div class="card-body text-center p-5">
                                        <div class="icon-wrapper mb-4">
                                            <i class="bi bi-bug-fill text-success" style="font-size: 3rem;"></i>
                                        </div>
                                        <h3 class="card-title h4 mb-3">Agrognosis</h3>
                                        <p class="card-text text-muted mb-4">Upload plant images for disease detection and analysis</p>
                                        <a href="#" class="btn btn-success btn-lg px-4" id="startAgrognosis">
                                            Get Started <i class="bi bi-arrow-right ms-2"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- AgriSage Card -->
                            <div class="col-md-6">
                                <div class="card h-100 border-primary shadow-lg hover-scale">
                                    <div class="card-body text-center p-5">
                                        <div class="icon-wrapper mb-4">
                                            <i class="bi bi-tree-fill text-primary" style="font-size: 3rem;"></i>
                                        </div>
                                        <h3 class="card-title h4 mb-3">AgriSage</h3>
                                        <p class="card-text text-muted mb-4">Advanced predictive analytics and consultation services</p>
                                        <a href="#" class="btn btn-primary btn-lg px-4" id="startAgriSage">
                                            Get Started <i class="bi bi-arrow-right ms-2"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-dark text-white py-4">
            <div class="container text-center">
                <p class="mb-0">&copy; 2023 AGRI DOC. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
