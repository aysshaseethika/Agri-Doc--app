<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrognosis - Disease Detection | AGRI DOC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex flex-column">
        <!-- Header -->
        <header class="bg-success text-white py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <a href="index.html" class="text-white text-decoration-none">
                    <h1 class="h4 mb-0">AGRI DOC</h1>
                </a>
                <nav>
                    <a href="index.html" class="btn btn-outline-light btn-sm me-2">
                        <i class="bi bi-house-door"></i> Home
                    </a>
                    <a href="agrisage.html" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-tree"></i> AgriSage
                    </a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow-1 py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card shadow-sm mb-4">
                            <div class="card-body">
                                <h2 class="h4 mb-4">
                                    <i class="bi bi-bug-fill text-success me-2"></i>Plant Disease Detection
                                </h2>
                                
                                <!-- Upload Section -->
                                <div class="upload-area p-4 text-center border rounded-3 mb-4" id="uploadArea">
                                    <i class="bi bi-cloud-arrow-up display-4 text-muted mb-3"></i>
                                    <h5 class="mb-3">Upload Plant Image</h5>
                                    <p class="text-muted small mb-3">
                                        Upload a clear photo of a plant leaf for disease detection
                                    </p>
                                    <input type="file" id="imageUpload" accept="image/*" class="d-none">
                                    <button class="btn btn-success" onclick="document.getElementById('imageUpload').click()">
                                        <i class="bi bi-upload me-2"></i>Choose Image
                                    </button>
                                </div>

                                <!-- Preview Section -->
                                <div id="previewSection" class="text-center mb-4 d-none">
                                    <div class="position-relative d-inline-block">
                                        <img id="imagePreview" src="#" alt="Preview" class="img-fluid rounded-3 border" style="max-height: 300px;">
                                        <button id="removeImage" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 rounded-circle">
                                            <i class="bi bi-x"></i>
                                        </button>
                                    </div>
                                    <div class="mt-3">
                                        <button id="analyzeBtn" class="btn btn-success">
                                            <i class="bi bi-search me-2"></i>Analyze Plant
                                        </button>
                                    </div>
                                </div>

                                <!-- Results Section -->
                                <div id="resultsSection" class="d-none">
                                    <h5 class="border-bottom pb-2 mb-3">Analysis Results</h5>
                                    <div id="diseaseResult" class="mb-4">
                                        <!-- Results will be populated by JavaScript -->
                                    </div>
                                    
                                    <!-- Bio-Climate Simulation Section -->
                                    <div class="card border-primary mb-4">
                                        <div class="card-header bg-primary text-white">
                                            <i class="bi bi-cloud-sun me-2"></i>Bio-Climate Simulation
                                        </div>
                                        <div class="card-body" id="bioClimateSection">
                                            <div class="text-center py-4">
                                                <div class="spinner-border text-primary" role="status">
                                                    <span class="visually-hidden">Loading...</span>
                                                </div>
                                                <p class="mt-2 mb-0">Running bio-climate analysis...</p>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Recommended Actions -->
                                    <div class="card border-warning">
                                        <div class="card-header bg-warning">
                                            <i class="bi bi-lightbulb me-2"></i>Recommended Actions
                                        </div>
                                        <div class="card-body" id="recommendedActions">
                                            <!-- Actions will be populated by JavaScript -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-dark text-white py-3">
            <div class="container text-center">
                <p class="mb-0 small">&copy; 2023 AGRI DOC. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="agrognosis.js"></script>
</body>
</html>
